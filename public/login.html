<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vantum Action Planner</title>
    <link rel="icon" type="image/png" href="/vantum-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <base href="/">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Accessibility: Set base font size to 16px minimum for mobile accessibility */
        html {
            font-size: 16px; /* Prevents iOS zoom on input focus, ensures readable base size */
        }
        
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: #1A1E29;
            border-radius: 8px;
            border: 1px solid #2A2E39;
        }
        
        /* Mobile responsive styles for accessibility */
        @media (max-width: 768px) {
            .login-container {
                margin: 40px auto;
                padding: 30px 20px;
                max-width: calc(100% - 40px);
            }
            
            .login-header h1 {
                font-size: 1.75em; /* 28px at 16px base - readable heading */
            }
            
            .login-header p {
                font-size: 1em; /* 16px - accessible body text */
            }
            
            .form-group label {
                font-size: 1em; /* 16px - accessible label text */
            }
            
            .auth-submit-btn {
                font-size: 1em; /* 16px - accessible button text */
                padding: 14px; /* Better touch target */
            }
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header img {
            max-width: 60px;
            margin-bottom: 15px;
        }
        .login-header h1 {
            margin: 0 0 10px 0;
            color: #FFFFFF;
        }
        .login-header p {
            color: #A3A6B4;
            margin: 0;
        }
        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid #2A2E39;
            padding-bottom: 10px;
        }
        .auth-tabs button {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: #A3A6B4;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .auth-tabs button.active {
            color: #FFFFFF;
            border-bottom-color: #3498db;
        }
        .auth-tabs button:hover {
            color: #FFFFFF;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #FFFFFF;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0A0E17;
            border: 1px solid #2A2E39;
            border-radius: 6px;
            color: #FFFFFF;
            font-size: 16px; /* Accessibility: Minimum 16px to prevent iOS zoom */
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }
        .auth-status {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .auth-status.success {
            background: #2d5016;
            color: #90ee90;
            border: 1px solid #4a7c2a;
        }
        .auth-status.error {
            background: #5a1a1a;
            color: #ff6b6b;
            border: 1px solid #8b2a2a;
        }
        .auth-submit-btn {
            width: 100%;
            padding: 12px;
            background: #007A7A;
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .auth-submit-btn:hover {
            background: #009999;
        }
        .auth-submit-btn:disabled {
            background: #2A2E39;
            cursor: not-allowed;
        }
        #terms-checkbox-group {
            margin-top: 10px;
        }
        #terms-checkbox-group a {
            color: #00D4AA;
            text-decoration: none;
        }
        #terms-checkbox-group a:hover {
            text-decoration: underline;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #3498db;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .password-requirements {
            margin-bottom: 15px;
            padding: 12px;
            background: #0A0E17;
            border-radius: 6px;
            border: 1px solid #2A2E39;
        }
        .password-requirements li.valid {
            color: #4CAF50;
        }
        .password-requirements li.invalid {
            color: #A3A6B4;
        }
        .form-group input.error {
            border-color: #ff6b6b;
        }
        .form-group input.valid {
            border-color: #4CAF50;
        }
        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #A3A6B4;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            width: 28px;
            height: 28px;
        }
        .password-toggle-btn:hover {
            color: #FFFFFF;
        }
        .password-toggle-btn svg {
            width: 20px;
            height: 20px;
            display: block;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <img src="/vantum-logo.png" alt="Vantum" class="logo" />
                <h1>Action Planner</h1>
                <p>Turn your idea into a clear plan in 60 seconds.</p>
            </div>

            <div class="auth-tabs">
                <button id="login-tab" class="active">Login</button>
                <button id="signup-tab">Sign Up</button>
            </div>

            <div id="auth-status" class="auth-status"></div>

            <form id="auth-form">
                <div class="form-group">
                    <label for="auth-email">Email *</label>
                    <input type="email" id="auth-email" placeholder="your.email@example.com" required />
                </div>
                <div class="form-group">
                    <label for="auth-password">Password *</label>
                    <div style="position: relative;">
                        <input type="password" id="auth-password" placeholder="Enter your password" required style="padding-right: 45px;" />
                        <button type="button" id="toggle-password" class="password-toggle-btn" aria-label="Show password">
                            <svg id="eye-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block;">
                                <path d="M10 4C6 4 3.73 7.11 2.5 9.5C3.73 11.89 6 15 10 15C14 15 16.27 11.89 17.5 9.5C16.27 7.11 14 4 10 4ZM10 12.5C8.07 12.5 6.5 10.93 6.5 9C6.5 7.07 8.07 5.5 10 5.5C11.93 5.5 13.5 7.07 13.5 9C13.5 10.93 11.93 12.5 10 12.5ZM10 7C8.9 7 8 7.9 8 9C8 10.1 8.9 11 10 11C11.1 11 12 10.1 12 9C12 7.9 11.1 7 10 7Z" fill="currentColor"/>
                            </svg>
                            <svg id="eye-off-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: none;">
                                <path d="M2.5 2.5L17.5 17.5M8.5 8.5C8.19 8.82 8 9.24 8 9.5C8 10.6 8.9 11.5 10 11.5C10.26 11.5 10.68 11.31 11 11M14.5 14.5C13.27 15.89 11 19 7 19C3 19 0.73 15.89 -0.5 13.5C0.23 12.73 0.73 11.5 1.5 10.5M6.5 6.5C5.27 5.11 3 2 7 2C11 2 13.27 5.11 14.5 7.5C13.77 8.27 13.27 9.5 12.5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="password-confirm-group" class="form-group" style="display: none;">
                    <label for="auth-password-confirm">Confirm Password *</label>
                    <div style="position: relative;">
                        <input type="password" id="auth-password-confirm" placeholder="Confirm your password" style="padding-right: 45px;" />
                        <button type="button" id="toggle-password-confirm" class="password-toggle-btn" aria-label="Show password">
                            <svg id="eye-icon-confirm" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block;">
                                <path d="M10 4C6 4 3.73 7.11 2.5 9.5C3.73 11.89 6 15 10 15C14 15 16.27 11.89 17.5 9.5C16.27 7.11 14 4 10 4ZM10 12.5C8.07 12.5 6.5 10.93 6.5 9C6.5 7.07 8.07 5.5 10 5.5C11.93 5.5 13.5 7.07 13.5 9C13.5 10.93 11.93 12.5 10 12.5ZM10 7C8.9 7 8 7.9 8 9C8 10.1 8.9 11 10 11C11.1 11 12 10.1 12 9C12 7.9 11.1 7 10 7Z" fill="currentColor"/>
                            </svg>
                            <svg id="eye-off-icon-confirm" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: none;">
                                <path d="M2.5 2.5L17.5 17.5M8.5 8.5C8.19 8.82 8 9.24 8 9.5C8 10.6 8.9 11.5 10 11.5C10.26 11.5 10.68 11.31 11 11M14.5 14.5C13.27 15.89 11 19 7 19C3 19 0.73 15.89 -0.5 13.5C0.23 12.73 0.73 11.5 1.5 10.5M6.5 6.5C5.27 5.11 3 2 7 2C11 2 13.27 5.11 14.5 7.5C13.77 8.27 13.27 9.5 12.5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="forgot-password-link" style="text-align: right; margin-top: -15px; margin-bottom: 15px; display: none;">
                    <a href="#" id="forgot-password-btn" style="color: #3498db; text-decoration: none; font-size: 14px;">Forgot password?</a>
                </div>
                <div id="forgot-password-form" style="display: none;">
                    <div class="form-group">
                        <label for="forgot-email">Email *</label>
                        <input type="email" id="forgot-email" placeholder="your.email@example.com" />
                    </div>
                    <button type="button" id="send-reset-btn" class="auth-submit-btn">Send Reset Link</button>
                    <button type="button" id="back-to-login-btn" class="auth-submit-btn" style="background: #2A2E39; margin-top: 10px;">Back to Login</button>
                </div>
                <div id="password-requirements" class="password-requirements" style="display: none;">
                    <small style="color: #A3A6B4; font-size: 12px; display: block; margin-bottom: 10px;">Password must:</small>
                    <ul style="color: #A3A6B4; font-size: 12px; margin: 0 0 15px 20px; padding: 0; list-style: none;">
                        <li id="req-length" style="margin-bottom: 5px;">• At least 8 characters</li>
                        <li id="req-uppercase" style="margin-bottom: 5px;">• One uppercase letter</li>
                        <li id="req-lowercase" style="margin-bottom: 5px;">• One lowercase letter</li>
                        <li id="req-number" style="margin-bottom: 5px;">• One number</li>
                    </ul>
                </div>
                <div id="signup-options-group" class="form-group" style="display: none;">
                    <label style="display: flex; align-items: start; cursor: pointer; font-weight: normal; margin-bottom: 15px;">
                        <input type="checkbox" id="newsletter-checkbox" checked style="margin-right: 10px; margin-top: 3px; width: auto; cursor: pointer;" />
                        <span style="color: #A3A6B4; font-size: 14px;">
                            Subscribe to our newsletter for updates and tips
                        </span>
                    </label>
                    <label style="display: flex; align-items: start; cursor: pointer; font-weight: normal;">
                        <input type="checkbox" id="terms-checkbox" checked style="margin-right: 10px; margin-top: 3px; width: auto; cursor: pointer;" />
                        <span style="color: #A3A6B4; font-size: 14px;">
                            I agree to the <a href="/terms.html" target="_blank" style="color: #00D4AA; text-decoration: none;">Terms and Conditions</a> 
                            and <a href="/privacy.html" target="_blank" style="color: #00D4AA; text-decoration: none;">Privacy Policy</a> *
                        </span>
                    </label>
                </div>
                <button type="submit" id="auth-submit-btn" class="auth-submit-btn">Login</button>
            </form>

            <div class="back-link">
                <a href="/login.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
