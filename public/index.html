<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypothesis Scoper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="/vantum-logo.png" alt="Vantum" class="logo" />
            <h1>Hypothesis Scoper</h1>
            <p class="subtitle">Convert ideas → hypotheses → scopes</p>
        </header>

        <!-- Step 1: Idea Input -->
        <section class="card" id="idea-section">
            <h2>1. Enter Your Idea</h2>
            <textarea 
                id="idea-input" 
                placeholder="Paste your raw brain dump here..."
                rows="8"
            ></textarea>
            <div class="button-group">
                <button id="generate-hypothesis-btn" class="btn btn-primary">
                    Generate Hypothesis
                </button>
                <button id="advanced-mode-btn" class="btn btn-primary">
                    Advanced Mode
                </button>
            </div>
            <div id="hypothesis-loading" class="loading-container" style="display: none;">
                <div class="loading-text">Generating hypothesis...</div>
                <div class="progress-bar-container">
                    <div id="hypothesis-progress-bar" class="progress-bar"></div>
                </div>
                <div class="time-estimate">
                    <span id="hypothesis-time-elapsed">0s</span> elapsed
                    <span id="hypothesis-time-estimate" class="estimate-text"></span>
                </div>
            </div>
        </section>

        <!-- Step 2: Hypothesis Output with Side-by-Side Layout -->
        <section class="card" id="hypothesis-section" style="display: none;">
            <div class="section-header">
                <h2>2. Your Hypothesis</h2>
                <button id="copy-hypothesis-btn" class="btn btn-secondary btn-small">
                    Copy to Clipboard
                </button>
            </div>
            
            <!-- Hypothesis Output -->
            <div class="hypothesis-panel">
                <div id="hypothesis-output" class="output hypothesis-output"></div>
            </div>
            
            <div class="action-buttons">
                <button id="generate-scope-btn" class="btn btn-primary btn-spacing">
                    Generate Scope
                </button>
            </div>
            <div id="scope-loading" class="loading-container" style="display: none;">
                <div class="loading-text">Generating scope...</div>
                <div class="progress-bar-container">
                    <div id="scope-progress-bar" class="progress-bar"></div>
                </div>
                <div class="time-estimate">
                    <span id="scope-time-elapsed">0s</span> elapsed
                    <span id="scope-time-estimate" class="estimate-text"></span>
                </div>
            </div>
        </section>

        <!-- Step 3: Scope Output -->
        <section class="card" id="scope-section" style="display: none;">
            <div class="section-header">
                <h2>3. Generated Scope</h2>
                <button id="copy-scope-btn" class="btn btn-secondary btn-small">
                    Copy to Clipboard
                </button>
            </div>
            <div id="scope-output" class="output"></div>
        </section>

        <!-- Error messages -->
        <div id="error-message" class="error" style="display: none;"></div>

        <!-- Success notification -->
        <div id="success-notification" class="success-notification" style="display: none;">
            Copied to clipboard!
        </div>
    </div>

    <!-- Advanced Mode Modal (Full Screen ChatGPT-like) -->
    <div id="advanced-modal" class="advanced-modal" style="display: none;">
        <div class="advanced-modal-content">
            <div class="advanced-modal-header">
                <h3>Advanced Mode - Refine Your Idea</h3>
                <button id="close-advanced-modal" class="advanced-modal-close-btn">&times;</button>
            </div>
            <div id="advanced-chat-messages" class="advanced-chat-messages"></div>
            <div class="advanced-chat-input-container">
                <textarea id="advanced-chat-input" class="advanced-chat-input" placeholder="Tell me about your idea..." rows="2"></textarea>
                <button id="advanced-send-btn" class="btn btn-primary advanced-send-btn">Send</button>
            </div>
            <div class="advanced-modal-footer">
                <button id="cancel-advanced-btn" class="btn btn-secondary">Cancel</button>
                <button id="generate-from-advanced-btn" class="btn btn-primary" disabled>Generate Hypothesis</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
