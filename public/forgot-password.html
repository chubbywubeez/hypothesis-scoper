<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Vantum Action Planner</title>
    <link rel="icon" type="image/png" href="/vantum-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <base href="/">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Accessibility: Set base font size to 16px minimum for mobile accessibility */
        html {
            font-size: 16px;
        }
        
        .forgot-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: #1A1E29;
            border-radius: 8px;
            border: 1px solid #2A2E39;
        }
        
        /* Mobile responsive styles */
        @media (max-width: 768px) {
            .forgot-container {
                margin: 40px auto;
                padding: 30px 20px;
                max-width: calc(100% - 40px);
            }
            
            .forgot-header h1 {
                font-size: 1.75em;
            }
            
            .forgot-header p {
                font-size: 1em;
            }
        }
        
        .forgot-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .forgot-header img {
            max-width: 60px;
            margin-bottom: 15px;
        }
        
        .forgot-header h1 {
            margin: 0 0 10px 0;
            color: #FFFFFF;
        }
        
        .forgot-header p {
            color: #A3A6B4;
            margin: 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #FFFFFF;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0A0E17;
            border: 1px solid #2A2E39;
            border-radius: 6px;
            color: #FFFFFF;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .forgot-status {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .forgot-status.success {
            background: #2d5016;
            color: #90ee90;
            border: 1px solid #4a7c2a;
        }
        
        .forgot-status.error {
            background: #5a1a1a;
            color: #ff6b6b;
            border: 1px solid #8b2a2a;
        }
        
        .reset-submit-btn {
            width: 100%;
            padding: 12px;
            background: #007A7A;
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .reset-submit-btn:hover {
            background: #009999;
        }
        
        .reset-submit-btn:disabled {
            background: #2A2E39;
            cursor: not-allowed;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #3498db;
            text-decoration: none;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="forgot-container">
            <div class="forgot-header">
                <img src="/vantum-logo.png" alt="Vantum" class="logo" />
                <h1>Forgot Password?</h1>
                <p>Enter your email address and we'll send you instructions to reset your password.</p>
            </div>

            <!-- Status message container -->
            <div id="forgot-status" class="forgot-status"></div>

            <!-- Forgot password form -->
            <form id="forgot-form">
                <div class="form-group">
                    <label for="forgot-email">Email *</label>
                    <input 
                        type="email" 
                        id="forgot-email" 
                        placeholder="your.email@example.com" 
                        required 
                        autocomplete="email"
                    />
                </div>
                <button type="submit" id="reset-submit-btn" class="reset-submit-btn">
                    Reset Password
                </button>
            </form>

            <div class="back-link">
                <a href="/login.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <script src="forgot-password.js"></script>
</body>
</html>
