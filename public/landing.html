<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vantum Action Planner</title>
    <link rel="icon" type="image/png" href="/vantum-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <base href="/">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Accessibility: Set base font size to 16px minimum for mobile accessibility */
        html {
            font-size: 16px; /* Prevents iOS zoom on input focus, ensures readable base size */
        }
        
        /* Landing page specific styles */
        .landing-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
            box-sizing: border-box;
            width: 100%;
        }

        /* Logo styling */
        .landing-logo {
            max-width: 80px;
            height: auto;
            margin-bottom: 40px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            opacity: 1;
            filter: brightness(0) invert(1);
            transition: filter 0.3s ease;
        }

        .landing-logo:hover {
            filter: brightness(0) invert(0.8);
        }

        /* Main heading */
        .landing-heading {
            font-size: 3.5em;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 24px;
            line-height: 1.2;
            white-space: nowrap;
        }
        
        /* Allow wrapping on smaller screens */
        @media (max-width: 600px) {
            .landing-heading {
                white-space: normal;
            }
        }

        /* Subheading */
        .landing-subheading {
            font-size: 1.5em;
            color: #A3A6B4;
            margin-bottom: 48px;
            line-height: 1.5;
            font-weight: 400;
        }

        /* CTA Button - matches login screen teal color */
        .landing-cta {
            background: #007A7A;
            color: #FFFFFF;
            border: none;
            padding: 18px 48px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: inline-block;
        }

        .landing-cta:hover {
            background: #009999;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 122, 122, 0.3);
        }

        .landing-cta:active {
            transform: translateY(0);
        }

        /* Responsive design for mobile */
        @media (max-width: 768px) {
            .landing-container {
                padding: 20px 15px;
                min-height: calc(100vh - 40px);
            }

            .landing-logo {
                max-width: 60px;
                margin-bottom: 30px;
            }

            /* Accessibility: Larger heading for mobile readability */
            .landing-heading {
                font-size: 2.5em;
                margin-bottom: 20px;
            }

            /* Accessibility: Ensure subheading is at least 16px (1em base) */
            .landing-subheading {
                font-size: 1.25em; /* 20px at default 16px base */
                margin-bottom: 36px;
            }

            /* Accessibility: Button text should be readable */
            .landing-cta {
                padding: 16px 36px;
                font-size: 1.125em; /* 18px at default 16px base */
                width: 100%;
                max-width: 300px;
            }
        }
        
        /* Extra small screens (phones) */
        @media (max-width: 480px) {
            .landing-container {
                padding: 30px 12px;
                min-height: calc(100vh - 20px);
            }

            .landing-logo {
                max-width: 50px;
                margin-bottom: 24px;
            }

            /* Accessibility: Maintain readable heading size */
            .landing-heading {
                font-size: 2em; /* 32px at default 16px base */
                margin-bottom: 16px;
                line-height: 1.3;
                padding: 0 10px;
            }

            /* Accessibility: Ensure subheading meets minimum readable size */
            .landing-subheading {
                font-size: 1.125em; /* 18px at default 16px base - above minimum */
                margin-bottom: 32px;
                padding: 0 10px;
                line-height: 1.5; /* Better line spacing for readability */
            }

            /* Accessibility: Button text should be at least 16px */
            .landing-cta {
                padding: 16px 28px; /* Increased padding for better touch target */
                font-size: 1em; /* 16px - minimum accessible size */
                width: calc(100% - 24px);
                max-width: none;
            }
        }

        /* Animation for fade-in effect */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .landing-logo {
            animation: fadeIn 0.6s ease-out;
        }

        .landing-heading {
            animation: fadeIn 0.8s ease-out;
        }

        .landing-subheading {
            animation: fadeIn 1s ease-out;
        }

        .landing-cta {
            animation: fadeIn 1.2s ease-out;
        }
    </style>
    <script>
        // Capture acquisition details (UTM parameters, referrer) for Beehiv tracking
        (function() {
            const params = new URLSearchParams(window.location.search);
            const utmParams = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
            
            // Store UTM parameters in sessionStorage so they persist to login page
            utmParams.forEach(param => {
                const value = params.get(param);
                if (value) {
                    sessionStorage.setItem(param, value);
                }
            });
            
            // Store referrer and landing page
            if (document.referrer) {
                sessionStorage.setItem('referrer', document.referrer);
            }
            if (!sessionStorage.getItem('landing_page')) {
                sessionStorage.setItem('landing_page', window.location.pathname);
            }
        })();
        
        // Check if user is already logged in and redirect to app
        (function() {
            const savedToken = localStorage.getItem('authToken');
            if (savedToken) {
                // Verify token is still valid
                fetch('/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${savedToken}`
                    }
                })
                .then(response => {
                    if (response.ok) {
                        // User is authenticated, redirect to app
                        window.location.href = '/index.html';
                    } else {
                        // Token invalid, clear it and stay on landing page
                        localStorage.removeItem('authToken');
                    }
                })
                .catch(error => {
                    console.error('Auth check error:', error);
                    localStorage.removeItem('authToken');
                });
            }
        })();
    </script>
</head>
<body>
    <div class="landing-container">
        <!-- Logo -->
        <img src="/vantum-logo.png" alt="Vantum" class="landing-logo" />
        
        <!-- Main heading -->
        <h1 class="landing-heading">Stop building the wrong thing.</h1>
        
        <!-- Subheading -->
        <p class="landing-subheading">Turn your vague ideas into executable plans</p>
        
        <!-- CTA Button -->
        <a href="/login.html" class="landing-cta">Generate my plan</a>
    </div>
</body>
</html>
