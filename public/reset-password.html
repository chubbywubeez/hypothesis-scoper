<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Vantum Action Planner</title>
    <link rel="icon" type="image/png" href="/vantum-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <base href="/">
    <link rel="stylesheet" href="styles.css">
    <style>
        html {
            font-size: 16px;
        }
        
        .reset-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: #1A1E29;
            border-radius: 8px;
            border: 1px solid #2A2E39;
        }
        
        @media (max-width: 768px) {
            .reset-container {
                margin: 40px auto;
                padding: 30px 20px;
                max-width: calc(100% - 40px);
            }
        }
        
        .reset-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .reset-header img {
            max-width: 60px;
            margin-bottom: 15px;
        }
        
        .reset-header h1 {
            margin: 0 0 10px 0;
            color: #FFFFFF;
        }
        
        .reset-header p {
            color: #A3A6B4;
            margin: 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #FFFFFF;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0A0E17;
            border: 1px solid #2A2E39;
            border-radius: 6px;
            color: #FFFFFF;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .reset-status {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .reset-status.success {
            background: #2d5016;
            color: #90ee90;
            border: 1px solid #4a7c2a;
        }
        
        .reset-status.error {
            background: #5a1a1a;
            color: #ff6b6b;
            border: 1px solid #8b2a2a;
        }
        
        .reset-submit-btn {
            width: 100%;
            padding: 12px;
            background: #007A7A;
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .reset-submit-btn:hover {
            background: #009999;
        }
        
        .reset-submit-btn:disabled {
            background: #2A2E39;
            cursor: not-allowed;
        }
        
         .password-toggle-btn {
             position: absolute;
             right: 12px;
             top: 50%;
             transform: translateY(-50%);
             background: transparent;
             border: none;
             color: #A3A6B4;
             cursor: pointer;
             padding: 4px;
             display: flex;
             align-items: center;
             justify-content: center;
             transition: color 0.2s;
             width: 28px;
             height: 28px;
         }
         
         .password-toggle-btn:hover {
             color: #FFFFFF;
         }
         
         .password-toggle-btn svg {
             width: 20px;
             height: 20px;
             display: block;
             margin: 0;
             padding: 0;
         }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #3498db;
            text-decoration: none;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="reset-container">
            <div class="reset-header">
                <img src="/vantum-logo.png" alt="Vantum" class="logo" />
                <h1>Reset Password</h1>
                <p>Enter your new password</p>
            </div>

            <div id="reset-status" class="reset-status"></div>

            <form id="reset-form">
                <div class="form-group">
                    <label for="reset-password">New Password *</label>
                    <div style="position: relative;">
                        <input type="password" id="reset-password" placeholder="Enter your new password" required style="padding-right: 45px;" />
                        <button type="button" id="toggle-reset-password" class="password-toggle-btn" aria-label="Show password">
                            <svg id="eye-icon-reset" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block;">
                                <path d="M10 4C6 4 3.73 7.11 2.5 9.5C3.73 11.89 6 15 10 15C14 15 16.27 11.89 17.5 9.5C16.27 7.11 14 4 10 4ZM10 12.5C8.07 12.5 6.5 10.93 6.5 9C6.5 7.07 8.07 5.5 10 5.5C11.93 5.5 13.5 7.07 13.5 9C13.5 10.93 11.93 12.5 10 12.5ZM10 7C8.9 7 8 7.9 8 9C8 10.1 8.9 11 10 11C11.1 11 12 10.1 12 9C12 7.9 11.1 7 10 7Z" fill="currentColor"/>
                            </svg>
                            <svg id="eye-off-icon-reset" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: none;">
                                <path d="M2.5 2.5L17.5 17.5M8.5 8.5C8.19 8.82 8 9.24 8 9.5C8 10.6 8.9 11.5 10 11.5C10.26 11.5 10.68 11.31 11 11M14.5 14.5C13.27 15.89 11 19 7 19C3 19 0.73 15.89 -0.5 13.5C0.23 12.73 0.73 11.5 1.5 10.5M6.5 6.5C5.27 5.11 3 2 7 2C11 2 13.27 5.11 14.5 7.5C13.77 8.27 13.27 9.5 12.5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reset-password-confirm">Confirm New Password *</label>
                    <div style="position: relative;">
                        <input type="password" id="reset-password-confirm" placeholder="Confirm your new password" required style="padding-right: 45px;" />
                        <button type="button" id="toggle-reset-password-confirm" class="password-toggle-btn" aria-label="Show password">
                            <svg id="eye-icon-reset-confirm" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block;">
                                <path d="M10 4C6 4 3.73 7.11 2.5 9.5C3.73 11.89 6 15 10 15C14 15 16.27 11.89 17.5 9.5C16.27 7.11 14 4 10 4ZM10 12.5C8.07 12.5 6.5 10.93 6.5 9C6.5 7.07 8.07 5.5 10 5.5C11.93 5.5 13.5 7.07 13.5 9C13.5 10.93 11.93 12.5 10 12.5ZM10 7C8.9 7 8 7.9 8 9C8 10.1 8.9 11 10 11C11.1 11 12 10.1 12 9C12 7.9 11.1 7 10 7Z" fill="currentColor"/>
                            </svg>
                            <svg id="eye-off-icon-reset-confirm" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: none;">
                                <path d="M2.5 2.5L17.5 17.5M8.5 8.5C8.19 8.82 8 9.24 8 9.5C8 10.6 8.9 11.5 10 11.5C10.26 11.5 10.68 11.31 11 11M14.5 14.5C13.27 15.89 11 19 7 19C3 19 0.73 15.89 -0.5 13.5C0.23 12.73 0.73 11.5 1.5 10.5M6.5 6.5C5.27 5.11 3 2 7 2C11 2 13.27 5.11 14.5 7.5C13.77 8.27 13.27 9.5 12.5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" id="reset-submit-btn" class="reset-submit-btn">Reset Password</button>
            </form>

            <div class="back-link">
                <a href="/login.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        // Get token from URL hash (Supabase redirects with #access_token=...)
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get('access_token');
        const type = hashParams.get('type');
        const isRecovery = type === 'recovery';
        
        const resetForm = document.getElementById('reset-form');
        const resetPassword = document.getElementById('reset-password');
        const resetPasswordConfirm = document.getElementById('reset-password-confirm');
        const resetSubmitBtn = document.getElementById('reset-submit-btn');
        const resetStatus = document.getElementById('reset-status');
        
        // Store token in sessionStorage for API call
        if (accessToken && isRecovery) {
            sessionStorage.setItem('resetToken', accessToken);
        }
        
        // Password toggle functionality
        const toggleResetPasswordBtn = document.getElementById('toggle-reset-password');
        const toggleResetPasswordConfirmBtn = document.getElementById('toggle-reset-password-confirm');
        const eyeIconReset = document.getElementById('eye-icon-reset');
        const eyeOffIconReset = document.getElementById('eye-off-icon-reset');
        const eyeIconResetConfirm = document.getElementById('eye-icon-reset-confirm');
        const eyeOffIconResetConfirm = document.getElementById('eye-off-icon-reset-confirm');
        
        if (toggleResetPasswordBtn && resetPassword) {
            toggleResetPasswordBtn.addEventListener('click', () => {
                const isPassword = resetPassword.type === 'password';
                resetPassword.type = isPassword ? 'text' : 'password';
                if (eyeIconReset) eyeIconReset.style.display = isPassword ? 'none' : 'block';
                if (eyeOffIconReset) eyeOffIconReset.style.display = isPassword ? 'block' : 'none';
            });
        }
        
        if (toggleResetPasswordConfirmBtn && resetPasswordConfirm) {
            toggleResetPasswordConfirmBtn.addEventListener('click', () => {
                const isPassword = resetPasswordConfirm.type === 'password';
                resetPasswordConfirm.type = isPassword ? 'text' : 'password';
                if (eyeIconResetConfirm) eyeIconResetConfirm.style.display = isPassword ? 'none' : 'block';
                if (eyeOffIconResetConfirm) eyeOffIconResetConfirm.style.display = isPassword ? 'block' : 'none';
            });
        }
        
        function showResetStatus(message, type) {
            resetStatus.textContent = message;
            resetStatus.className = `reset-status ${type}`;
            resetStatus.style.display = 'block';
        }
        
        function hideResetStatus() {
            resetStatus.style.display = 'none';
        }
        
        // Check if we have a valid reset token
        resetToken = sessionStorage.getItem('resetToken') || accessToken;
        if (!resetToken || !isRecovery) {
            showResetStatus('Invalid or expired reset link. Please request a new password reset.', 'error');
            resetForm.style.display = 'none';
        }
        
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = resetPassword.value.trim();
            const passwordConfirm = resetPasswordConfirm.value.trim();
            
            if (!password || !passwordConfirm) {
                showResetStatus('Please enter both password fields', 'error');
                return;
            }
            
            // Validate password requirements
            const passwordErrors = [];
            if (password.length < 8) {
                passwordErrors.push('at least 8 characters');
            }
            if (!/[A-Z]/.test(password)) {
                passwordErrors.push('one uppercase letter');
            }
            if (!/[a-z]/.test(password)) {
                passwordErrors.push('one lowercase letter');
            }
            if (!/[0-9]/.test(password)) {
                passwordErrors.push('one number');
            }
            
            if (passwordErrors.length > 0) {
                showResetStatus(`Password must contain ${passwordErrors.join(', ')}`, 'error');
                return;
            }
            
            if (password !== passwordConfirm) {
                showResetStatus('Passwords do not match', 'error');
                return;
            }
            
            resetSubmitBtn.disabled = true;
            resetSubmitBtn.textContent = 'Resetting...';
            hideResetStatus();
            
            try {
                // Get token from sessionStorage or URL
                const tokenToUse = sessionStorage.getItem('resetToken') || accessToken || resetToken;
                
                if (!tokenToUse) {
                    throw new Error('No reset token found. Please request a new password reset.');
                }
                
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${tokenToUse}`
                    },
                    body: JSON.stringify({ 
                        password
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to reset password');
                }
                
                showResetStatus('Password reset successfully! Redirecting to login...', 'success');
                
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
                
            } catch (error) {
                console.error('Reset password error:', error);
                showResetStatus(error.message || 'Failed to reset password. The link may have expired.', 'error');
            } finally {
                resetSubmitBtn.disabled = false;
                resetSubmitBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
